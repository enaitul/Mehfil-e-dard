    <div class="contact-right">
      <form name="submit-to-google-sheet">
  <input type="text" name="Name" placeholder="Your Name" required>
  <input type="text" name="Instagram" placeholder="Your Instagram ID" required>
  <textarea name="Poetry" rows="6" placeholder="Pour your mind here..." required></textarea>
  <button type="submit" class="btn btn2">Send!</button>
</form>


      <span id="msg"></span>

    <script src="app.js"></script>
<script>
  const scriptURL = 'https://script.google.com/macros/s/AKfycbx4sQxXFozEUv6Y06Hw8YeLjV0CPDmqfyYqpCggnt6QsAb3lbQW1Mi0H3sNXK11bNzb/exec'
  const form = document.forms['submit-to-google-sheet']
        const msg = document.getElementById("msg")
        form.addEventListener('submit', e => {
            e.preventDefault()
            fetch(scriptURL, { method: 'POST', body: new FormData(form) })
                .then(response => {
                    msg.innerHTML = "Message sent succesfully"
                    setTimeout(function () {
                        msg.innerHTML = ""
                    }, 1000)
                    form.reset()
                })
                .catch(error => console.error('Error!', error.message))
        })
</script>
